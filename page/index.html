<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>msg</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #080b0c;
      --ink-1: #e8f0f1;
      --ink-2: #a3b1b4;
      --ink-3: #7f8d91;
      --accent: #5bd6ff;
      --line: rgba(255, 255, 255, .08);
    }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
      color: var(--ink-1);
      background:
        radial-gradient(640px 420px at 82% -10%, rgba(91, 214, 255, .13), transparent 62%),
        radial-gradient(480px 340px at 0% 110%, rgba(240, 168, 104, .06), transparent 60%),
        var(--page);
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(400px, 100%);
      padding: 26px 28px;
      text-align: left;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(24, 32, 34, .9), rgba(14, 19, 21, .92));
      box-shadow: 0 40px 90px -50px rgba(0, 0, 0, .9), inset 0 1px 0 rgba(255, 255, 255, .04);
      backdrop-filter: blur(20px);
    }
    .mark {
      width: 38px; height: 38px; display: grid; place-items: center;
      margin-bottom: 16px;
      border-radius: 11px;
      border: 1px solid rgba(91, 214, 255, .32);
      background: rgba(91, 214, 255, .12);
      color: var(--accent);
      font: 700 17px/1 ui-monospace, Consolas, monospace;
    }
    strong { display: block; margin-bottom: 4px; font-size: 17px; letter-spacing: -.02em; }
    p { margin: 0; color: var(--ink-3); font-size: 12.5px; }
    .bar {
      margin-top: 18px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .06);
      overflow: hidden;
    }
    .bar span {
      display: block;
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: sweep 1.6s ease-in-out infinite;
    }
    button {
      margin-top: 16px;
      padding: 7px 15px;
      font: 600 12.5px/1 inherit;
      color: #04161c;
      background: var(--accent);
      border: 0;
      border-radius: 9px;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.06); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @keyframes sweep {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar span { animation: none; width: 100%; opacity: .4; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">m</div>
    <strong id="title">msg</strong>
    <p id="status">Connecting to the local service…</p>
    <div class="bar" aria-hidden="true"><span></span></div>
  </main>
  <script src="_magpie/bridge.js"></script>
  <script src="boot.js"></script>
</body>
</html>
